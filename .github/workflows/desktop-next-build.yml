name: Soul Next native install gate
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Native gate scope (client requires Windows 10 and 11 standard-user desktop runners)
        type: choice
        options: [all, knowledge, upgrade, windows, client]
        default: all
  push:
    branches: ['codex/desktop-v3-native-gate']
    paths: ['desktop-next/**', '.github/workflows/desktop-next-build.yml', 'packages/core/src/**', 'expert-packs/**', 'shared/**', 'templates/**']
jobs:
  native-install:
    if: inputs.scope != 'client'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.scope == 'upgrade' || inputs.scope == 'windows') && '[{"os":"windows-2022","arch":"x64","target":"win"}]' || '[{"os":"windows-2022","arch":"x64","target":"win"},{"os":"macos-15","arch":"arm64","target":"mac"},{"os":"macos-15-intel","arch":"x64","target":"mac"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop-next
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop-next/package-lock.json
      - name: Confirm native host architecture
        run: node -e "if(process.arch !== '${{ matrix.arch }}') throw new Error('Non-native architecture'); console.log(process.platform, process.arch, process.version)"
      - name: Install locked dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build native installer
        run: npm run dist:${{ matrix.target }}
      - name: Verify expert persistence using the native Electron runtime
        if: inputs.scope != 'upgrade'
        run: npm run verify:experts
      - name: Verify resource isolation, recovery and persistence
        if: inputs.scope != 'upgrade'
        run: npm run verify:resources
      - name: Verify complete sources, bundled OCR and import crash recovery
        if: inputs.scope != 'upgrade'
        run: npm run verify:knowledge
      - name: Verify task execution, approvals and crash recovery
        if: inputs.scope != 'upgrade'
        run: npm run verify:tasks
      - name: Verify unified lookup, complete tables, scope and pinned task recovery
        if: inputs.scope != 'upgrade'
        run: npm run verify:lookup
      - name: Verify independent learning, provenance and billing checkpoints
        if: inputs.scope != 'upgrade'
        run: npm run verify:learning
      - name: Verify knowledge compatibility, backup and upgrade busy guards
        if: inputs.scope != 'upgrade'
        run: npm run verify:migration
      - name: Verify workflow versions, triggers and crash recovery
        if: inputs.scope != 'knowledge' && inputs.scope != 'upgrade'
        run: npm run verify:workflows
      - name: Verify connectors, IM pairing, permissions and settings
        if: inputs.scope != 'knowledge' && inputs.scope != 'upgrade'
        run: npm run verify:integrations
      - name: Verify update safety and data migration
        if: inputs.scope != 'knowledge' && inputs.scope != 'upgrade'
        run: npm run verify:updates
      - name: Install and launch the installed app twice
        if: inputs.scope != 'upgrade'
        run: npm run verify:${{ matrix.target }}
      - name: Verify native two-version installation and data preservation
        if: inputs.scope != 'knowledge'
        run: npm run verify:upgrade
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soul-next-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            desktop-next/evidence/
            desktop-next/build/resources/build-inputs.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload internal installation packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soul-next-packages-${{ matrix.os }}-${{ github.sha }}
          path: |
            desktop-next/release/*.exe
            desktop-next/release/*.dmg
            desktop-next/release/*.zip
            desktop-next/release/*.blockmap
            desktop-next/release/builder-effective-config.yaml
          if-no-files-found: warn
          retention-days: 7
  windows-client-fixture:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'client'
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop-next
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse Server and administrator environments for client acceptance
        shell: powershell
        run: |
          foreach ($version in '10', '11') {
            $folder = Join-Path $PWD "evidence\client-guard-server-$version"
            & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-windows-client.ps1 -ExpectedWindows $version -EvidenceDirectory $folder -PreflightOnly
            if ($LASTEXITCODE -eq 0) { throw 'Server incorrectly satisfied a Windows client gate' }
            $result = Get-Content -Raw -Encoding UTF8 (Join-Path $folder 'environment.json') | ConvertFrom-Json
            if ($result.ok -or $result.reasons -notcontains 'expected-windows-client-required' -or $result.reasons -notcontains 'standard-non-administrator-account-required') { throw 'Client guard did not reject Server and administrator identities' }
          }
          $global:LASTEXITCODE = 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop-next/package-lock.json
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run dist:win
      - name: Validate native two-version fixture before sending it to clients
        run: npm run verify:upgrade
      - name: Record native installers and installed-file fingerprints
        run: node scripts/write-windows-client-fixture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: soul-windows-client-fixture-${{ github.sha }}
          path: |
            desktop-next/windows-client-fixture.json
            desktop-next/release/*.exe
            desktop-next/release-upgrade/*.exe
            desktop-next/release-upgrade/candidate.yml
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soul-windows-client-fixture-evidence-${{ github.sha }}
          path: desktop-next/evidence/
          retention-days: 7
  windows-client:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'client'
    needs: windows-client-fixture
    strategy:
      fail-fast: false
      matrix:
        include:
          - windows: '10'
            label: soul-win10-standard
          - windows: '11'
            label: soul-win11-standard
    runs-on: [self-hosted, Windows, X64, '${{ matrix.label }}']
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop-next
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove Windows client, standard account and interactive desktop
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-windows-client.ps1 -ExpectedWindows ${{ matrix.windows }} -PreflightOnly
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop-next/package-lock.json
      - name: Install acceptance JS utilities without compiling or elevating
        run: npm ci --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: soul-windows-client-fixture-${{ github.sha }}
          path: desktop-next/client-fixture
      - name: Actual standard-user NSIS install, two launches, uninstall and updater upgrade
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-windows-client.ps1 -ExpectedWindows ${{ matrix.windows }} -FixtureDirectory "$PWD\client-fixture"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soul-windows-client-${{ matrix.windows }}-evidence-${{ github.sha }}
          path: desktop-next/evidence/
          retention-days: 7
